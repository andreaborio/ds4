name: Linux CPU CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premerge:
    name: Model-free premerge
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record toolchain
        run: |
          python3 --version
          cc --version
          make --version

      # This is the complete Linux CPU/model-free gate from the Makefile. It
      # does not replace the Apple Metal, qualified-model, or manual release
      # evidence required by QA_BEFORE_RELEASES.md.
      - name: Run repository and model-free premerge gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: make premerge
